[package]
name = "lemgendary-ai-studio-gui"
version = "2.10.61"
description = "LemGendary AI Studio Desktop GUI"
authors = ["LemGendary AI"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-shell = "2.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Screen recording (app window only). Exact pins; see README "Report Issue (Bug Reporter)".
openh264 = "=0.9.9"
mp4 = "=0.14.0"
bytes = "=1.12.1"

[target.'cfg(windows)'.dependencies]
windows-capture = "=2.0.1"
